<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteQuiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
:root {
    --p: #4f46e5;
    --bg1: #eef2ff;
    --bg2: #e0e7ff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ANA PENCERE */
.container {
    width: 100%;
    max-width: 900px;
    min-height: 700px;
    padding: 0 36px 28px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(79, 70, 229, .15);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.container::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, var(--p), #6366f1);
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 26px 0 20px;
    border-bottom: 1px solid var(--border);
}

.header h1 { margin: 0; font-size: 20px; font-weight: 700; }
.header h1 i { color: var(--p); margin-right: 8px; }

/* ANA MENÜ */
.menu-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 20px 40px;
}

.menu-section h2 { margin: 0 0 90px; font-size: 30px; font-weight: 700; }

.buttons-wrapper {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

/* BUTONLAR */
.menu-btn {
    flex: 1;
    min-width: 240px;
    padding: 22px 20px;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: .3s;
    box-shadow: 0 5px 15px rgba(0, 0, 0, .05);
}

.menu-btn:hover { transform: translateY(-3px); }

/* GÖRSEL SINIFLANDIRMA */
.btn-visual { background: #e3f2fd; color: #1976d2; border: 2px solid #90caf9; }
.btn-visual:hover { background: #bbdefb; box-shadow: 0 8px 20px rgba(25, 118, 210, .15); }

/* CODE BATTLE */
.btn-code { background: #e8f5e9; color: #388e3c; border: 2px solid #a5d6a7; }
.btn-code:hover { background: #c8e6c9; box-shadow: 0 8px 20px rgba(56, 142, 60, .15); }

/* COPYRIGHT */
.copyright {
    margin-top: auto;
    padding-top: 18px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .4px;
    color: #9ca3af;
    border-top: 1px solid #f1f5f9;
}

.copyright i { margin-right: 5px; color: #a5b4fc; }
.copyright strong { color: #6b7280; }

/* MOBİL */
@media(max-width: 700px) {
    body { padding: 12px; }
    .container { min-height: 650px; padding: 0 20px 24px; border-radius: 20px; }
    .header { padding: 24px 0 18px; }
    .header h1 { font-size: 18px; }
    .menu-section { padding: 40px 10px 30px; }
    .menu-section h2 { font-size: 25px; }
    .buttons-wrapper { flex-direction: column; gap: 14px; }
    .menu-btn { width: 100%; min-width: 0; padding: 20px; }
    .copyright { margin-top: 20px; }
}
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>
            <i class="fa-solid fa-code"></i> ByteQuiz
        </h1>
    </div>

    <!-- ANA MENÜ -->
    <div class="menu-section">
        <h2>Hoş Geldiniz!</h2>

        <div class="buttons-wrapper">
            <a href="/gorsel_siniflandirma" class="menu-btn btn-visual">
                <i class="fa-solid fa-image"></i> Görsel Sınıflandırma
            </a>

            <a href="/quiz" class="menu-btn btn-code">
                <i class="fa-solid fa-laptop-code"></i> Code Battle
            </a>
        </div>
    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">
        <i class="fa-regular fa-copyright"></i>
        <strong>Defne</strong> tarafından geliştirildi
    </div>

</div>

</body>
</html>
